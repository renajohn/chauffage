# Pompe à chaleur géothermique Alpha Innotec — lecture expliquée.
#
# Ce paquet ne pilote rien. Il traduit les entités de l'intégration
# luxtronik2 (préfixe luxtronik_300722_07_, Alpha Innotec @
# 192.168.86.37:8889) en capteurs qu'on comprend sans connaître les sigles
# allemands. Le pilotage de la consigne ECS vit ailleurs, dans
# packages/ecs_solaire.yaml : ne pas écrire de consigne ici.
#
# SOURCE DE VÉRITÉ : dépôt chauffage, ha/packages/pac.yaml, déployé par
# deploy/deploy-ha.sh. Ne pas éditer sur p-cloud.
#
# Sens des sondes, établi le 22.09.2026 : flow_in = DÉPART (Vorlauf),
# flow_out = RETOUR (Rücklauf). flow_out_temperature_target vaut 15,0 et
# correspond à temperature_target_return lu en direct sur la PAC ; or la
# régulation Alpha Innotec pilote sur le retour. La lecture directe donne
# temperature_supply 24,0 (= flow_in) et temperature_return 23,5 (= flow_out).

# DEUX COMPTEURS À NOUS POUR LE RENDEMENT CHAUFFAGE, parce que celui de la PAC
# est sale. Relevé du 22.09.2026 : heat_energy_input affiche 52,86 kWh alors
# que heat_amount_heating vaut 0,00 kWh et operation_hours_heating 0 h. Ce
# compteur n'a pas été remis à zéro avec les autres, et son résidu est pur et
# permanent : pendant la charge du ballon du même jour, dhw_energy_input est
# passé de 4,12 à 5,82 kWh sans que heat_energy_input bouge d'un centième.
#
# AUCUN SEUIL NE RATTRAPE UN OFFSET AU DÉNOMINATEUR, il ne fait que retarder le
# mensonge. Le rapport publié vaudrait H / (52,86 + H/COP) : avec le COP réel
# de cette machine (4,07 mesuré le 22.09.2026), il passe 1,5 à 127 kWh
# produits, 2,96 à 600 kWh, 3,62 à 2000 kWh et 3,84 sur une saison entière. Une
# condition « rapport ≥ 1,5 » publierait donc 1,5 le jour où elle se débloque,
# verdict « Faible : à regarder de près. », puis « Moyen » tout l'hiver pour
# une machine qui vaut « Bon ». Le seuil ne change que la date de la fausse
# annonce — et tout seuil assez haut pour rendre le chiffre juste (≈ 3,6)
# interdirait du même coup au capteur de jamais annoncer un mauvais rendement.
#
# utility_meter ne retient que les VARIATIONS de sa source. Les 52,86 kWh,
# acquis avant la création du compteur, n'y entrent jamais ; le rapport des
# deux est juste dès la première chauffe, sans rien attendre et sans rien
# supposer du COP.
#   - LES DEUX, ET PAS UN SEUL. Le jour où le propriétaire remettra les
#     compteurs de la PAC à zéro, un numérateur qui repart de zéro sur un
#     dénominateur qui continue donnerait à nouveau un chiffre faux. Deux
#     compteurs de même origine ne peuvent pas se désynchroniser, et
#     utility_meter absorbe la baisse de sa source sans rien soustraire.
#   - LE SENS AFFICHÉ NE CHANGE PAS : heat_amount_heating valant 0 aujourd'hui,
#     « depuis la remise à zéro des compteurs » et « depuis la création de ces
#     deux compteurs » désignent exactement la même période.
#   - CE QU'ILS NE PEUVENT PAS FAIRE : ce qui est produit pendant que Home
#     Assistant est arrêté leur échappe. Les deux le perdent ensemble, donc le
#     rapport reste juste ; ce sont les totaux qui sous-estiment.
#
# AVANT LA PREMIÈRE CHAUFFE, LES DEUX SONT « unknown », ET C'EST NORMAL : un
# utility_meter n'a pas d'état tant que sa source n'a pas varié, et ni
# heat_amount_heating ni heat_energy_input ne bougent, la PAC ne chauffant pas
# la maison. Ce n'est pas une panne, et rien n'est perdu : vérifié le
# 22.09.2026 sur un compteur jumeau créé exprès, source déjà à 52,86 kWh et
# compteur à « unknown », la PREMIÈRE variation 52,86 -> 55,36 a été comptée
# 2,50 — la variation, pas la valeur absolue, et pas zéro non plus.
# Ne JAMAIS revenir à une lecture directe de heat_energy_input sans avoir
# d'abord vérifié, sur la PAC, que ce compteur est reparti de zéro.
utility_meter:
  pac_chauffage_chaleur_nette:
    name: "PAC chauffage chaleur nette"
    source: sensor.luxtronik_300722_07_heat_amount_heating
  pac_chauffage_electricite_nette:
    name: "PAC chauffage électricité nette"
    source: sensor.luxtronik_300722_07_heat_energy_input

template:
  # La durée dans l'état courant doit avancer toute seule, minute après
  # minute. Un capteur d'état ne se recalcule qu'au changement de ses
  # sources : il faut donc un déclencheur horaire.
  - triggers:
      - trigger: state
        entity_id: sensor.pac_etat
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      # Un capteur à déclencheurs n'a pas d'état avant son premier
      # déclenchement. Or « homeassistant start » ne part PAS sur un
      # reload_all : sans cette ligne, la durée reste « unknown » jusqu'au
      # time_pattern suivant — jusqu'à une minute de trou, à l'endroit le
      # plus visible du tableau, après chaque rechargement de la
      # configuration YAML.
      - trigger: event
        event_type: event_template_reloaded
    sensor:
      - name: "PAC depuis"
        unique_id: pac_depuis
        icon: mdi:timer-sand
        # relative_time() rend l'anglais (« 14 hours »), ce qui jure dans une
        # interface française : la durée est formatée à la main, comme
        # duree_fr() dans gen_maison.py.
        #
        # states.sensor.pac_etat est gardé dans une variable et testé avant
        # qu'on touche à .last_changed : au tout premier déploiement, et
        # pendant un redémarrage de Home Assistant, l'entité n'existe pas
        # encore et l'expression vaut none. On retombe alors sur 0 seconde,
        # donc « moins d'une minute », plutôt que sur un capteur unknown.
        state: >-
          {% set s = states.sensor.pac_etat %}
          {% set d = ((as_timestamp(now())
             - as_timestamp(s.last_changed, as_timestamp(now()))) | int)
             if s is not none else 0 %}
          {% if d < 60 %}moins d'une minute
          {% elif d < 5400 %}{{ (d / 60) | round(0) | int }} min
          {% elif d < 172800 %}{{ (d / 3600) | round(0) | int }} h
          {% else %}{{ (d / 86400) | round(0) | int }} j{% endif %}

  - sensor:
      # Règle du paquet : le libellé français se lit en entier, et l'unique_id
      # n'est que son slug. Home Assistant fabrique l'identifiant d'entité à
      # partir du libellé affiché, jamais de l'unique_id, et object_id est
      # refusé par le domaine template (vérifié en 2026.9.3) : écrire ici un
      # unique_id qui ne slugifie pas le libellé fabriquerait une entité au
      # nom inattendu, que les tableaux référenceraient dans le vide.
      - name: "PAC état"
        unique_id: pac_etat
        # L'icône suit une règle plus courte que l'état : « Au-dessus de la
        # limite de chauffe » et « Au repos » partagent mdi:sleep, la PAC
        # étant arrêtée dans les deux cas. Mais l'ordre des branches est
        # exactement celui de la cascade d'états, et aucune branche qui
        # change la DIRECTION thermique n'est fondue dans une autre :
        # 'cooling' passe avant le compresseur, sans quoi « Rafraîchit »
        # s'afficherait sous une icône de chauffage.
        icon: >-
          {% set lux = 'luxtronik_300722_07_' %}
          {% set statut = states('sensor.' ~ lux ~ 'status') %}
          {% if not has_value('sensor.' ~ lux ~ 'status') %}mdi:lan-disconnect
          {% elif is_state('binary_sensor.' ~ lux ~ 'disturbance_output', 'on') %}mdi:alert-circle
          {% elif is_state('binary_sensor.' ~ lux ~ 'defrost_valve', 'on') %}mdi:snowflake-melt
          {% elif is_state('binary_sensor.' ~ lux ~ 'evu_unlocked', 'off') %}mdi:transmission-tower-off
          {% elif statut == 'hot_water' or is_state('binary_sensor.' ~ lux ~ 'dhw_charging_pump', 'on') %}mdi:water-boiler
          {% elif statut == 'cooling' %}mdi:snowflake
          {% elif is_state('binary_sensor.' ~ lux ~ 'compressor', 'on') %}mdi:heat-wave
          {% else %}mdi:sleep{% endif %}
        # ÉTAT DE PANNE : disturbance_output, jamais error_reason. Ce dernier
        # vaut 721 sans discontinuer depuis au moins 5 jours (relevé du
        # 22.09.2026) alors que la PAC va bien : c'est la DERNIÈRE erreur
        # mémorisée, pas une erreur active.
        #
        # « Au-dessus de la limite de chauffe » mérite d'être un état à part :
        # c'est la réponse à « pourquoi elle ne chauffe pas ? » un jour doux.
        # La PAC l'annonce elle-même — lecture directe du 22.09.2026 :
        # « Heizgrenze (Soll 15 °C) ».
        #
        # L'ÉNUMÉRATION COMPLÈTE de status, lue le 22.09.2026 dans
        # attributes.options du capteur en direct : heating, hot_water,
        # swimming_pool_solar, evu, defrost, no_request,
        # heating_external_source, cooling. Deux valeurs seulement ont été
        # OBSERVÉES — 'no_request' à l'arrêt, et 'hot_water' pendant la charge
        # du ballon du 22.09.2026 de 11 h 15 à 12 h 07. 'cooling' reste non
        # observée, et pourrait ne jamais l'être si le rafraîchissement passif
        # ne la produit pas : à confirmer à la première journée chaude.
        # swimming_pool_solar et heating_external_source tombent au défaut,
        # sans objet ici (ni piscine, ni appoint).
        state: >-
          {% set lux = 'luxtronik_300722_07_' %}
          {% set statut = states('sensor.' ~ lux ~ 'status') %}
          {% if not has_value('sensor.' ~ lux ~ 'status') %}Hors ligne
          {% elif is_state('binary_sensor.' ~ lux ~ 'disturbance_output', 'on') %}Erreur
          {% elif is_state('binary_sensor.' ~ lux ~ 'defrost_valve', 'on') %}Dégivre
          {% elif is_state('binary_sensor.' ~ lux ~ 'evu_unlocked', 'off') %}Bloquée par le réseau
          {% elif statut == 'hot_water' or is_state('binary_sensor.' ~ lux ~ 'dhw_charging_pump', 'on') %}Fait l'eau chaude
          {% elif statut == 'cooling' %}Rafraîchit
          {% elif is_state('binary_sensor.' ~ lux ~ 'compressor', 'on') %}Chauffe la maison
          {% elif statut == 'no_request' %}Au-dessus de la limite de chauffe
          {% else %}Au repos{% endif %}

      - name: "PAC explication"
        unique_id: pac_explication
        icon: mdi:text-long
        # La régulation Alpha Innotec pilote sur le RETOUR, ce qui rend la
        # chaîne de causalité lisible : consigne de retour contre retour réel.
        # Quand ecs_solaire a relevé la consigne du ballon, la phrase le dit —
        # sinon une consigne à 55 °C au lieu de 54 paraîtrait inexpliquée.
        #
        # LA PREMIÈRE BRANCHE GARDE TOUTES LES AUTRES. Sans elle, un
        # sensor.pac_etat à 'unknown' — l'état des quelques secondes qui
        # suivent un redémarrage, avant que la cascade n'ait tourné — ne
        # correspondait à aucun libellé et tombait au défaut : la phrase
        # affirmait « Rien ne tourne. » alors que personne ne savait encore
        # ce qui tournait. Une affirmation sur un état inconnu.
        state: >-
          {% set lux = 'luxtronik_300722_07_' %}
          {% set ext = states('sensor.' ~ lux ~ 'outdoor_temperature') | float(0) | round(1) %}
          {% set depart = states('sensor.' ~ lux ~ 'flow_in_temperature') | float(0) | round(1) %}
          {% set retour = states('sensor.' ~ lux ~ 'flow_out_temperature') | float(0) | round(1) %}
          {% set cible = states('sensor.' ~ lux ~ 'flow_out_temperature_target') | float(0) | round(1) %}
          {% set ballon = states('sensor.' ~ lux ~ 'dhw_temperature') | float(0) | round(1) %}
          {% set consigne = states('number.' ~ lux ~ 'dhw_target_temperature') | float(0) | round(0) | int %}
          {% set boost = is_state('input_boolean.ecs_solaire_boost_actif', 'on') %}
          {% set etat = states('sensor.pac_etat') %}
          {% if not has_value('sensor.pac_etat') %}L'état de la pompe à chaleur n'est pas encore connu : Home Assistant vient de démarrer ou de recharger sa configuration.
          {% elif etat == 'Hors ligne' %}La pompe à chaleur ne répond plus. Les valeurs affichées datent de sa dernière réponse.
          {% elif etat == 'Erreur' %}La pompe à chaleur signale un défaut. Code de la dernière erreur : {{ states('sensor.' ~ lux ~ 'error_reason') }}.
          {% elif etat == 'Bloquée par le réseau' %}Le fournisseur d'électricité a coupé l'autorisation de marche. La PAC reprendra d'elle-même.
          {% elif etat == 'Fait l\'eau chaude' %}Le ballon est à {{ ballon }} °C, la consigne est {{ consigne }} °C{% if boost %} — relevée pour absorber le surplus solaire{% endif %}. La PAC charge l'eau chaude ; le chauffage reprendra ensuite.
          {% elif etat == 'Chauffe la maison' %}Il fait {{ ext }} °C dehors. La courbe vise {{ cible }} °C au retour ; le retour est à {{ retour }} °C, le départ à {{ depart }} °C. Le compresseur tourne pour combler l'écart.
          {% elif etat == 'Dégivre' %}La PAC dégivre son échangeur. C'est passager.
          {% elif etat == 'Rafraîchit' %}La PAC envoie la fraîcheur du sol dans le plancher. Départ {{ depart }} °C, retour {{ retour }} °C.
          {% elif etat == 'Au-dessus de la limite de chauffe' %}Il fait {{ ext }} °C dehors, au-dessus de la limite de chauffe : la PAC ne demande rien. Le plancher est à {{ retour }} °C au retour.
          {% else %}Rien ne tourne. Il fait {{ ext }} °C dehors, le retour du plancher est à {{ retour }} °C.{% endif %}

      # LES DEUX ÉCARTS NE VEULENT RIEN DIRE COMPRESSEUR À L'ARRÊT : l'eau
      # stagne et les sondes s'équilibrent. Relevé du 22.09.2026 à l'arrêt,
      # tout le circuit à 24 °C, saumure comprise : l'écart source valait
      # 0,0 K, physiquement impossible en marche. D'où l'availability.
      #
      # EN MARCHE, C'EST MESURÉ. Pendant la charge du ballon du 22.09.2026, de
      # 11 h 15 à 12 h 07 : écart chauffage 2,6 K (départ 49,2, retour 46,6) et
      # écart source 3,4 K, POSITIF — la machine prend bien de la chaleur au
      # terrain. Les deux valeurs tombent dans les plages annoncées ci-dessous.
      #
      # SEUILS : valeurs de départ tirées de la littérature sur les planchers
      # chauffants en géothermie, PAS de mesures sur cette installation — cette
      # unique chauffe de cinquante minutes, qui plus est une charge d'eau
      # chaude, ne suffit pas à les asseoir. À revoir après une saison.
      - name: "PAC écart chauffage"
        unique_id: pac_ecart_chauffage
        unit_of_measurement: "K"
        state_class: measurement
        icon: mdi:delta
        availability: >-
          {{ is_state('binary_sensor.luxtronik_300722_07_compressor', 'on')
             and has_value('sensor.luxtronik_300722_07_flow_in_temperature')
             and has_value('sensor.luxtronik_300722_07_flow_out_temperature') }}
        state: >-
          {{ (states('sensor.luxtronik_300722_07_flow_in_temperature') | float(0)
              - states('sensor.luxtronik_300722_07_flow_out_temperature') | float(0)) | round(1) }}
        attributes:
          # 3 à 7 K : plage usuelle d'un plancher chauffant. Sous 2 K, la
          # circulation est trop rapide ou la PAC module à vide ; au-dessus de
          # 8 K, le débit est trop faible.
          verdict: >-
            {% set d = (states('sensor.luxtronik_300722_07_flow_in_temperature') | float(0)
                        - states('sensor.luxtronik_300722_07_flow_out_temperature') | float(0)) | round(1) %}
            {% if d < 2 %}Très faible : la circulation est rapide, ou la PAC module à vide.
            {% elif d <= 7 %}Normal pour un plancher chauffant.
            {% elif d <= 8 %}Un peu élevé : le débit commence à manquer.
            {% else %}Élevé : le débit du circuit est trop faible.{% endif %}

      - name: "PAC écart source"
        unique_id: pac_ecart_source
        unit_of_measurement: "K"
        state_class: measurement
        icon: mdi:earth
        # LE COMPRESSEUR ICI, LE DÉBIT DE SAUMURE POUR LA TEMPÉRATURE DU
        # FORAGE : deux gardes différentes sur la même boucle, et c'est
        # VOULU. Ne pas « harmoniser ». Une température de forage se lit dès
        # que le fluide circule, compresseur ou non ; un écart source, lui,
        # n'a de sens que si la machine PRÉLÈVE de la chaleur. En
        # rafraîchissement passif la pompe de saumure tourne sans compresseur
        # et le transfert s'inverse — l'écart deviendrait négatif et les
        # seuils ci-dessous, écrits pour un prélèvement, annonceraient
        # « Faible : on prend peu de chaleur au terrain » alors qu'on lui en
        # DONNE. Ce mode n'est pas théorique : operation_hours_cooling vaut
        # 1797 h au 22.09.2026.
        availability: >-
          {{ is_state('binary_sensor.luxtronik_300722_07_compressor', 'on')
             and has_value('sensor.luxtronik_300722_07_heat_source_input_temperature')
             and has_value('sensor.luxtronik_300722_07_heat_source_output_temperature') }}
        state: >-
          {{ (states('sensor.luxtronik_300722_07_heat_source_input_temperature') | float(0)
              - states('sensor.luxtronik_300722_07_heat_source_output_temperature') | float(0)) | round(1) }}
        attributes:
          # 2 à 5 K : plage usuelle. Au-dessus de 6 K, soit le débit de saumure
          # faiblit, soit le terrain ne rend plus assez.
          verdict: >-
            {% set d = (states('sensor.luxtronik_300722_07_heat_source_input_temperature') | float(0)
                        - states('sensor.luxtronik_300722_07_heat_source_output_temperature') | float(0)) | round(1) %}
            {% if d < 2 %}Faible : on prend peu de chaleur au terrain.
            {% elif d <= 5 %}Normal : le terrain rend bien.
            {% elif d <= 6 %}Un peu élevé : à surveiller.
            {% else %}Élevé : débit de saumure faible, ou terrain qui ne suit plus.{% endif %}

      - name: "PAC température du forage"
        unique_id: pac_temperature_du_forage
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-water
        # La saumure qui REVIENT du forage — une sonde géothermique
        # VERTICALE, pas un capteur horizontal : c'est elle qui porte la
        # chaleur prise au forage. L'entité est désactivée par défaut dans
        # l'intégration ; activée le 22.09.2026.
        #
        # GARDE SUR LE DÉBIT DE SAUMURE. Saumure immobile, les deux sondes ne
        # lisent plus le forage mais le LOCAL TECHNIQUE où elles sont posées.
        # Mesuré le 22.09.2026 (heures locales) :
        #   07:00 -> 11:16  circulation arrêtée   23,7 à 23,9 °C
        #   11:16:05        pompe de saumure      0 -> 2100 L/h
        #   11:17:05        compresseur           marche
        #   11:16 -> 11:19  la lecture s'effondre 23,8 -> 15,5 -> 13,6 °C
        #   11:19 -> 12:03  en marche             13,6 -> 12,8 °C, le forage
        #                                         rend sa chaleur
        #   12:06:24        compresseur           arrêt
        #   12:07:24        pompe de saumure      2100 -> 0 L/h
        #   12:07 -> 12:26  le fluide stagne      13,5 -> 16,9 °C
        # Sans cette garde, le capteur annonçait « Tiède : le forage s'est
        # rechargé, typique de l'été » à partir d'une lecture de local
        # technique. NE PAS LA RETIRER en croyant qu'une température se lit
        # toujours : celle-ci ne veut dire quelque chose que si le fluide
        # circule.
        #
        # LE DÉBIT PLUTÔT QUE LE COMPRESSEUR, pour deux raisons. C'est une
        # mesure directe de la circulation : 0 L/h à l'arrêt, 2000 à 2200 L/h
        # en marche, sans valeur intermédiaire sur l'historique du jour. Et la
        # pompe de saumure déborde le compresseur des deux côtés — une minute
        # avant au démarrage, une minute après à l'arrêt — en plus du
        # rafraîchissement passif, où elle tourne sans compresseur du tout. Un
        # guet sur le compresseur perdrait ces trois cas.
        #
        # CE RAISONNEMENT NE VAUT QUE POUR CE CAPTEUR-CI. L'écart source, sur
        # la même boucle, garde exprès le compresseur : voir le commentaire
        # posé au-dessus de son availability.
        availability: >-
          {{ states('sensor.luxtronik_300722_07_heat_source_flow_rate') | float(0) > 0
             and has_value('sensor.luxtronik_300722_07_heat_source_input_temperature') }}
        state: >-
          {{ states('sensor.luxtronik_300722_07_heat_source_input_temperature')
             | float(0) | round(1) }}
        attributes:
          # Au-dessus de 0 °C en saison de chauffe, confortable ; sous -5 °C,
          # le forage est sollicité au-delà de sa plage habituelle. Ces
          # bornes ne valent que sur une lecture de forage, donc saumure en
          # circulation : c'est l'availability ci-dessus qui le garantit.
          verdict: >-
            {% set t = states('sensor.luxtronik_300722_07_heat_source_input_temperature') | float(0) | round(1) %}
            {% if t < -5 %}Très froid : le forage est sollicité au-delà de sa plage habituelle.
            {% elif t < 0 %}Froid, mais dans la plage d'une fin d'hiver.
            {% elif t < 15 %}Normal pour un forage en saison de chauffe.
            {% else %}Tiède : le forage s'est rechargé, typique de l'été.{% endif %}


      # LES RENDEMENTS SONT CALCULÉS ICI, jamais lus depuis sensor.…cop_dhw
      # ni sensor.…cop_heating. Relevé du 22.09.2026 : cop_heating est resté
      # « unknown » toute la journée alors que ses deux ingrédients sont
      # présents et à jour — l'intégration ne fait pas le calcul. cop_dhw est
      # resté « unknown » lui aussi jusqu'au démarrage du compresseur à
      # 11 h 15, puis s'est mis à suivre l'instant : 0,0 à 30 W de tirage,
      # puis 3,36, 5,17, 5,91, 5,14, 4,98 d'une minute à l'autre. Ce n'est
      # donc pas le rapport cumulé 15,0 / 4,12 = 3,64 que son nom promet.
      #
      # La PAC estime elle-même sa consommation électrique — il n'existe aucun
      # compteur dédié, les trois phases mesurées sont globales. Cette
      # estimation est corroborée : 4,12 kWh sur 1,56 h font 2,64 kW de tirage
      # moyen, en plein dans la fourchette « 2,4 kW au démarrage, 3,3 kW en fin
      # de cycle » relevée les 20 et 21.09.2026 et consignée en tête de
      # packages/ecs_solaire.yaml. Deux sources indépendantes qui concordent.
      #
      # SEUILS DES VERDICTS : valeurs de littérature sur les pompes à chaleur
      # géothermiques, PAS des mesures sur cette installation — les compteurs
      # ont été remis à zéro avec le nouveau système. À revoir après une
      # saison de chauffe.
      #
      # LES QUATRE CAPTEURS DIVISENT, et c'est l'availability SEULE qui les
      # protège du diviseur nul : « | float(1) » ne rend 1 que si la
      # conversion échoue (« unknown »), jamais sur un état « 0.0 », qui se
      # convertit très bien. Rendu à part, chacun des quatre state lève
      # ZeroDivisionError (éprouvé le 22.09.2026). Home Assistant rend
      # l'availability en premier et n'évalue ni le state ni les attributs
      # quand elle est fausse (helpers/event.py, « super template ») : ne
      # jamais retirer une de ces conditions.
      - name: "PAC rendement eau chaude"
        unique_id: pac_rendement_eau_chaude
        state_class: measurement
        icon: mdi:water-boiler
        availability: >-
          {{ states('sensor.luxtronik_300722_07_dhw_energy_input') | float(0) > 0.1 }}
        state: >-
          {{ (states('sensor.luxtronik_300722_07_dhw_heat_amount') | float(0)
              / states('sensor.luxtronik_300722_07_dhw_energy_input') | float(1)) | round(2) }}
        attributes:
          verdict: >-
            {% set c = (states('sensor.luxtronik_300722_07_dhw_heat_amount') | float(0)
                       / states('sensor.luxtronik_300722_07_dhw_energy_input') | float(1)) | round(2) %}
            {% if c >= 4 %}Très bon pour de l'eau chaude.
            {% elif c >= 3 %}Correct : chauffer à 54 °C coûte toujours plus que chauffer un plancher.
            {% else %}Faible : la PAC peine à monter le ballon.{% endif %}

      # CE CAPTEUR NE LIT PAS LES COMPTEURS DE LA PAC, mais les deux
      # utility_meter déclarés en tête de fichier : heat_energy_input porte un
      # résidu de 52,86 kWh qui fausserait le rapport tout l'hiver. Le
      # raisonnement complet, chiffres à l'appui, est là-haut.
      #
      # LE PLANCHER DE 10 kWh AU DÉNOMINATEUR n'est pas le garde-fou du
      # diviseur nul, c'est celui des PALIERS. Le compteur électrique de la PAC
      # ne poste sa consommation qu'en fin de cycle : mesuré le 22.09.2026 côté
      # eau chaude, dhw_heat_amount est monté de 15,0 à 19,8 kWh pendant que
      # dhw_energy_input restait figé à 4,12, puis a rattrapé d'un bloc de
      # 1,70 kWh. Un cycle non encore posté vaut au plus ~2,6 kWh (une heure de
      # compresseur à 2,64 kW, moyenne mesurée). Sur un cumul de 0,2 kWh le
      # rapport afficherait « Excellent » à 20 ; sous 10 kWh il peut encore
      # être surestimé d'un quart ; au-delà il converge vite — 10 % à 26 kWh.
      # Ce plancher retarde de quelques heures de chauffe la première annonce,
      # et n'influe en rien sur la valeur annoncée, qui est celle des deux
      # compteurs et d'eux seuls.
      - name: "PAC rendement chauffage"
        unique_id: pac_rendement_chauffage
        state_class: measurement
        icon: mdi:radiator
        availability: >-
          {{ states('sensor.pac_chauffage_chaleur_nette') | float(0) > 0.1
             and states('sensor.pac_chauffage_electricite_nette') | float(0) > 10 }}
        state: >-
          {{ (states('sensor.pac_chauffage_chaleur_nette') | float(0)
              / states('sensor.pac_chauffage_electricite_nette') | float(1)) | round(2) }}
        attributes:
          verdict: >-
            {% set c = (states('sensor.pac_chauffage_chaleur_nette') | float(0)
                       / states('sensor.pac_chauffage_electricite_nette') | float(1)) | round(2) %}
            {% if c >= 4.5 %}Excellent pour de la géothermie sur plancher.
            {% elif c >= 4 %}Bon.
            {% elif c >= 3 %}Moyen : la courbe de chauffe est peut-être trop haute.
            {% else %}Faible : à regarder de près.{% endif %}

      # VÉRIFIÉ LE 22.09.2026, À LA PREMIÈRE CHAUFFE OBSERVÉE :
      # current_heat_output et current_power_consumption renvoient bien de
      # vraies valeurs en marche — 10 212 W pour 1 985 W à 11 h 20, le
      # compresseur ayant démarré à 11 h 15. Le seuil de 100 W n'est pas
      # décoratif : à 11 h 15 le tirage valait 30 W, démarrage à peine amorcé,
      # et l'intégration en tirait un COP de 0,0. Sous 100 W il n'y a rien à
      # diviser.
      - name: "PAC rendement instantané"
        unique_id: pac_rendement_instantane
        state_class: measurement
        icon: mdi:speedometer
        availability: >-
          {{ states('sensor.luxtronik_300722_07_current_power_consumption') | float(0) > 100 }}
        state: >-
          {{ (states('sensor.luxtronik_300722_07_current_heat_output') | float(0)
              / states('sensor.luxtronik_300722_07_current_power_consumption') | float(1)) | round(2) }}
        attributes:
          verdict: >-
            {% set c = (states('sensor.luxtronik_300722_07_current_heat_output') | float(0)
                       / states('sensor.luxtronik_300722_07_current_power_consumption') | float(1)) | round(2) %}
            {% if c >= 4 %}Bon rendement en ce moment.
            {% elif c >= 3 %}Rendement moyen en ce moment.
            {% else %}Rendement faible en ce moment.{% endif %}

      # Durée moyenne d'un cycle de compresseur. Exige dix démarrages : au
      # 22.09.2026 en fin de journée il n'y en a eu que trois, pour 2,4 h de
      # marche (compressor1_operation_hours, relevé après la chauffe de
      # 11 h 15 - 12 h 07), les compteurs ayant été remis à zéro avec le
      # nouveau système. Une moyenne sur trois démarrages ne vaut rien.
      - name: "PAC cycle moyen"
        unique_id: pac_cycle_moyen
        unit_of_measurement: "min"
        state_class: measurement
        icon: mdi:restart
        availability: >-
          {{ states('sensor.luxtronik_300722_07_compressor1_impulses') | int(0) >= 10 }}
        state: >-
          {{ (states('sensor.luxtronik_300722_07_compressor1_operation_hours') | float(0) * 60
              / states('sensor.luxtronik_300722_07_compressor1_impulses') | int(1)) | round(0) | int }}
        attributes:
          verdict: >-
            {% set m = (states('sensor.luxtronik_300722_07_compressor1_operation_hours') | float(0) * 60
                       / states('sensor.luxtronik_300722_07_compressor1_impulses') | int(1)) | round(0) | int %}
            {% if m >= 20 %}Cycles longs : c'est sain pour le compresseur.
            {% elif m >= 10 %}Cycles acceptables.
            {% else %}Cycles courts : ils usent le compresseur.{% endif %}
